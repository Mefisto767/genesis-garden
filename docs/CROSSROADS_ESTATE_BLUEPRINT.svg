<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#273528" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#f5f1de} .title{font-size:30px;font-weight:800}
      .sub{font-size:15px;fill:#b9c6b5}.zone{font-size:18px;font-weight:800}.small{font-size:13px}
      .tiny{font-size:11px}.label{font-size:14px;font-weight:700}.outline{stroke:#f6d77a;stroke-width:3}
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#101712"/>
  <text x="40" y="32" class="title">GENESIS GARDEN — CROSSROADS ESTATE</text>
  <text x="940" y="32" class="sub">Канонический world contract • 48×48 тайлов • 32 world px / тайл</text>

  <!-- full 48×48 logical world -->
  <g transform="translate(40 64)">
    <rect width="864" height="864" rx="6" fill="#17231a" stroke="#60785e" stroke-width="2"/>
    <rect x="270" y="0" width="324" height="288" fill="#486f45" class="outline"/>
    <rect x="594" y="288" width="270" height="288" fill="#356b69" class="outline"/>
    <rect x="0" y="288" width="270" height="288" fill="#765277" class="outline"/>
    <rect x="270" y="288" width="324" height="288" fill="#8aa552" class="outline"/>
    <rect x="270" y="576" width="324" height="288" fill="#34435f" class="outline"/>
    <rect width="864" height="864" fill="url(#grid)"/>

    <text x="432" y="35" text-anchor="middle" class="zone">СЕВЕР • РАБОЧАЯ ФЕРМА</text>
    <text x="432" y="60" text-anchor="middle" class="small">первое расширение</text>
    <text x="432" y="82" text-anchor="middle" class="small">+6 обычных грядок • теплица +4</text>
    <text x="432" y="104" text-anchor="middle" class="small">питомник • семена</text>

    <text x="729" y="322" text-anchor="middle" class="zone">ВОСТОК</text>
    <text x="729" y="346" text-anchor="middle" class="small">пруд + опылители</text>
    <text x="729" y="368" text-anchor="middle" class="small">3 aquatic habitats</text>
    <text x="729" y="390" text-anchor="middle" class="small">0 обычных грядок</text>

    <text x="135" y="322" text-anchor="middle" class="zone">ЗАПАД</text>
    <text x="135" y="346" text-anchor="middle" class="small">выставочный двор</text>
    <text x="135" y="368" text-anchor="middle" class="small">павильон • витрины</text>
    <text x="135" y="390" text-anchor="middle" class="small">гостевые ворота</text>

    <text x="432" y="612" text-anchor="middle" class="zone">ЮГ • ПОЗДНЯЯ ИГРА</text>
    <text x="432" y="636" text-anchor="middle" class="small">ночной сад • Лунная линза</text>
    <text x="432" y="658" text-anchor="middle" class="small">Genesis Conservatory</text>

    <text x="432" y="320" text-anchor="middle" class="zone">ЦЕНТРАЛЬНЫЙ САД</text>
    <text x="432" y="342" text-anchor="middle" class="small">постоянное ядро • стартовые 6 грядок</text>

    <!-- central exact objects; map origin is full-world tile 0,0 -->
    <rect x="320" y="378" width="72" height="72" rx="6" fill="#be7b46" stroke="#342117" stroke-width="3"/>
    <text x="356" y="418" text-anchor="middle" class="tiny">ДОМ</text>
    <rect x="536" y="468" width="72" height="72" rx="6" fill="#714b83" stroke="#342117" stroke-width="3"/>
    <text x="572" y="508" text-anchor="middle" class="tiny">LAB</text>
    <rect x="331" y="498" width="40" height="40" fill="#7d593b" stroke="#342117" stroke-width="2"/>
    <text x="351" y="522" text-anchor="middle" class="tiny">СКЛ</text>
    <circle cx="450" cy="342" r="12" fill="#e3c451" stroke="#3a2b1d" stroke-width="3"/>
    <text x="450" y="326" text-anchor="middle" class="tiny">ЛЮМИ</text>
    <circle cx="432" cy="369" r="22" fill="none" stroke="#d8c16d" stroke-width="3" stroke-dasharray="5 4"/>

    <!-- plots at exact world positions -->
    <g fill="#5f3926" stroke="#ecd08c" stroke-width="2">
      <rect x="378" y="387" width="36" height="36"/><rect x="432" y="387" width="36" height="36"/><rect x="486" y="387" width="36" height="36"/>
      <rect x="378" y="441" width="36" height="36"/><rect x="432" y="441" width="36" height="36"/><rect x="486" y="441" width="36" height="36"/>
    </g>
    <g class="tiny">
      <text x="396" y="410" text-anchor="middle">1</text><text x="450" y="410" text-anchor="middle">2</text><text x="504" y="410" text-anchor="middle">3</text>
      <text x="396" y="464" text-anchor="middle">4</text><text x="450" y="464" text-anchor="middle">5</text><text x="504" y="464" text-anchor="middle">6</text>
    </g>
    <rect x="416" y="513" width="56" height="39" rx="12" fill="#2f7f91" stroke="#a9d8d0" stroke-width="2"/>
    <text x="444" y="537" text-anchor="middle" class="tiny">ПРУД</text>
    <path d="M369 418V495H553" fill="none" stroke="#d5aa58" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="439" cy="486" r="7" fill="#fff0c9" stroke="#342117" stroke-width="2"/>

    <!-- passages -->
    <g fill="#231a16" stroke="#f6d77a" stroke-width="3">
      <rect x="411" y="279" width="42" height="18"/><rect x="585" y="411" width="18" height="42"/>
      <rect x="411" y="567" width="42" height="18"/><rect x="261" y="411" width="18" height="42"/>
    </g>
    <text x="432" y="273" text-anchor="middle" class="tiny">N</text><text x="610" y="436" class="tiny">E</text>
    <text x="432" y="600" text-anchor="middle" class="tiny">S</text><text x="248" y="436" class="tiny">W</text>
  </g>

  <!-- contract and progression -->
  <g transform="translate(940 72)">
    <rect width="520" height="856" rx="10" fill="#18231b" stroke="#526a52" stroke-width="2"/>
    <text x="24" y="40" class="zone">КАК РАСШИРЯЮТСЯ ГРЯДКИ</text>
    <text x="24" y="73" class="label">Старт</text><text x="160" y="73" class="small">6 обычных</text>
    <path d="M26 91H490" stroke="#394b3b"/>
    <text x="24" y="122" class="label">Север</text><text x="160" y="122" class="small">+6 обычных + 4 тепличных</text>
    <text x="160" y="145" class="small">итого 12 + 4</text>
    <path d="M26 163H490" stroke="#394b3b"/>
    <text x="24" y="194" class="label">Восток</text><text x="160" y="194" class="small">3 aquatic • обычных +0</text>
    <text x="24" y="230" class="label">Запад</text><text x="160" y="230" class="small">экспозиция • обычных +0</text>
    <text x="24" y="266" class="label">Юг</text><text x="160" y="266" class="small">специальные late-game места</text>

    <text x="24" y="324" class="zone">ЧТО УЖЕ ЕСТЬ В ЯДРЕ</text>
    <text x="24" y="358" class="small">✓ 6 plot slots и interactions</text>
    <text x="24" y="384" class="small">✓ посадка → рост → maturity → collection</text>
    <text x="24" y="410" class="small">✓ Genetics V2, Reveal, mutation, economy</text>
    <text x="24" y="436" class="small">✓ responsive camera и desktop/mobile</text>
    <text x="24" y="462" class="small">✓ 4 физически закрытых прохода</text>
    <text x="24" y="488" class="small" fill="#f0aa84">✗ unlock проходов ещё не реализован</text>
    <text x="24" y="514" class="small" fill="#f0aa84">✗ +6/+4 и habitats ещё не реализованы</text>

    <text x="24" y="574" class="zone">ПРОИЗВОДСТВЕННЫЙ ПОРЯДОК</text>
    <rect x="24" y="598" width="472" height="46" rx="8" fill="#314734"/><text x="42" y="627" class="label">1. World contract и прогрессия</text>
    <rect x="24" y="656" width="472" height="46" rx="8" fill="#3d4d34"/><text x="42" y="685" class="label">2. Цельный Visual Bible + asset kit</text>
    <rect x="24" y="714" width="472" height="46" rx="8" fill="#4c4931"/><text x="42" y="743" class="label">3. Art-test на реальном масштабе</text>
    <rect x="24" y="772" width="472" height="46" rx="8" fill="#5a4230"/><text x="42" y="801" class="label">4. Интеграция без изменения ядра</text>
  </g>
</svg>
